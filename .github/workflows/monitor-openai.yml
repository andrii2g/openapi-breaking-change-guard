name: Monitor OpenAI API compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: monitor-openai-api
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout accepted baseline and tool
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify baseline provenance
        id: baseline
        shell: bash
        run: |
          set -euo pipefail

          test -s baselines/openai.json
          test -s baselines/openai-baseline.lock.json

          baseline_ref="$(jq -r '.ref' baselines/openai-baseline.lock.json)"
          expected_sha="$(jq -r '.sha256' baselines/openai-baseline.lock.json)"
          actual_sha="$(sha256sum baselines/openai.json | cut -d ' ' -f 1)"

          if [[ ! "$baseline_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Baseline lock does not contain a full lowercase commit SHA." >&2
            exit 2
          fi

          if [[ -z "$expected_sha" || "$expected_sha" == "null" ]]; then
            echo "Baseline lock does not contain sha256." >&2
            exit 2
          fi

          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Baseline SHA-256 does not match its lock file." >&2
            exit 2
          fi

          echo "ref=$baseline_ref" >> "$GITHUB_OUTPUT"

      - name: Build guard
        run: >-
          dotnet build
          src/OpenApiBreakingChangeGuard.Cli/OpenApiBreakingChangeGuard.Cli.csproj
          --configuration Release

      - name: Download current OpenAI specification
        id: current
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          current_ref="$(git ls-remote https://github.com/openai/openai-openapi.git refs/heads/main | cut -f1)"
          if [[ ! "$current_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the current OpenAI OpenAPI commit." >&2
            exit 2
          fi

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --dump-header artifacts/openai-download-headers.txt \
            --output artifacts/openai-current.json \
            "https://raw.githubusercontent.com/openai/openai-openapi/$current_ref/openapi.json"

          test -s artifacts/openai-current.json
          jq -e '.openapi and (.paths | type == "object")' \
            artifacts/openai-current.json >/dev/null
          sha256sum artifacts/openai-current.json \
            > artifacts/openai-current.sha256
          printf '%s\n' "$current_ref" > artifacts/openai-current-ref.txt
          echo "ref=$current_ref" >> "$GITHUB_OUTPUT"

      - name: Compare current specification with accepted baseline
        id: guard
        shell: bash
        run: |
          set +e

          dotnet run \
            --project src/OpenApiBreakingChangeGuard.Cli/OpenApiBreakingChangeGuard.Cli.csproj \
            --configuration Release \
            --no-build \
            -- \
            baselines/openai.json \
            artifacts/openai-current.json \
            --old-revision "${{ steps.baseline.outputs.ref }}" \
            --new-revision "${{ steps.current.outputs.ref }}" \
            --old-revision-url "https://github.com/openai/openai-openapi/blob/${{ steps.baseline.outputs.ref }}/openapi.json" \
            --new-revision-url "https://github.com/openai/openai-openapi/blob/${{ steps.current.outputs.ref }}/openapi.json" \
            --profile client \
            --include-info \
            --report artifacts/openai-compatibility-report.md

          guard_exit_code=$?
          echo "exit_code=$guard_exit_code" >> "$GITHUB_OUTPUT"

          # Publish the report before applying the semantic failure.
          exit 0

      - name: Add report to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/openai-compatibility-report.md ]]; then
            cat artifacts/openai-compatibility-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# OpenAI API compatibility monitor"
              echo
              echo "> The compatibility report was not generated. Inspect the workflow logs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload current specification and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-api-compatibility-${{ github.run_number }}
          path: |
            artifacts/openai-current.json
            artifacts/openai-current.sha256
            artifacts/openai-current-ref.txt
            artifacts/openai-download-headers.txt
            artifacts/openai-compatibility-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Interpret guard result
        if: always()
        shell: bash
        env:
          GUARD_EXIT_CODE: ${{ steps.guard.outputs.exit_code }}
        run: |
          if [[ -z "$GUARD_EXIT_CODE" ]]; then
            echo "::error::The compatibility guard did not produce an exit code."
            exit 2
          fi

          case "$GUARD_EXIT_CODE" in
            0)
              echo "No breaking OpenAPI changes detected."
              ;;
            1)
              echo "::warning title=OpenAPI breaking changes detected::Review the job summary and uploaded compatibility report."
              ;;
            2)
              echo "::error title=OpenAPI monitor failed::The guard could not read or validate its inputs, or write the report."
              exit 2
              ;;
            3)
              echo "::error title=OpenAPI analysis incomplete::Compatibility could not be established within the supported scope."
              exit 3
              ;;
            *)
              echo "::error title=Unexpected guard result::The guard returned exit code $GUARD_EXIT_CODE."
              exit 2
              ;;
          esac

